function img(imgId, alt, style) {
  const src = IMAGES[imgId];
  if (src) return `<img src="${src}" alt="${alt}" style="${style};object-fit:cover;object-position:center top">`;
  return `<div class="img-placeholder" style="${style}">${alt}</div>`;
}

function renderHeader() {
  const navItems = NAV_PAGES.map(n => {
    const active = state.page === n.page;
    return `<span data-action="nav" data-page="${n.page}" style="color:${active ? "var(--accent-dark)" : "var(--dark)"};font-weight:${active ? 700 : 400}">${n.label}</span>`;
  }).join("");

  return `
  <header>
    <div class="header-inner">
      <div class="logo" data-action="nav" data-page="home">${SITE.shortName}</div>
      <nav>${navItems}</nav>
      <button class="btn btn-primary" data-action="nav" data-page="contact" style="font-size:13px;padding:11px 22px">${COPY.header.cta}</button>
    </div>
  </header>`;
}

  <section class="section" style="padding-top:0">

    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${problemCards}</div>
    ${recommendedBlock}
  </section>

  <section style="background:var(--bg-alt);padding:80px 28px">
    <div style="max-width:1240px;margin:0 auto;display:flex;gap:48px;flex-wrap:wrap;align-items:center">
      <div style="flex:1;min-width:280px">

        <p style="margin:0;font-size:14.5px;color:var(--text-1)">${detail.bestFit}</p>
      </div>
    </section>`;
  }

  const cards = EXPERTS.map(e => `
    <div class="card" style="display:flex;flex-direction:column;gap:14px">

        <div class="display" style="font-size:18px">${e.name}</div>
        <div style="font-size:12.5px;color:var(--accent-dark);margin-top:4px">${e.title}</div>
      </div>
      <button class="btn btn-dark" data-action="view-expert" data-id="${e.id}" style="align-self:flex-start;font-size:13px;padding:11px 20px">${c.viewProfileLabel}</button>
    </div>`).join("");

  return `
  <section class="section fade-in">
    <div class="eyebrow">${c.eyebrow}</div>
    <h1 class="display" style="font-size:clamp(32px,5vw,46px);margin:0 0 20px;max-width:680px">${c.heading}</h1>
    <p style="font-size:16.5px;color:var(--text-1);max-width:640px;margin:0 0 44px">${c.body}</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${cards}</div>
  </section>`;
}

  const c = COPY.pricing;

    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="display" style="font-size:17px">${t.name}</div>
      <div class="display" style="font-size:26px">${t.price}</div>

    <div data-action="nav" data-page="contact" style="font-size:13.5px;color:var(--accent-dark);font-weight:600;cursor:pointer;margin-bottom:44px">${c.internationalLine}</div>

  const principleCards = PRINCIPLES.map(pr => `

      <div class="display" style="font-size:16px;margin-bottom:8px">${pr.title}</div>

  return `

      ${c.paragraphs.map(p => `<p style="margin:0">${p}</p>`).join("")}
      <p style="margin:0;font-weight:600;color:var(--dark)">${c.boldParagraph}</p>

    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px">${principleCards}</div>

function renderContact() {
  const c = COPY.contact;

  if (state.leadSubmitted) {
    const problemLabel = state.lead.problem ? (PROBLEMS.find(p => p.id === state.lead.problem) || {}).title || "Not specified" : "Not specified";
    const supportLabel = state.lead.support ? (SUPPORT_OPTIONS.find(o => o.id === state.lead.support) || {}).label || "Not specified" : "Not specified";
    return `
    <section class="section-narrow fade-in">
      <div style="text-align:center;padding:40px 0">
        <h2 class="display" style="font-size:32px;margin:0 0 16px">${c.submitted.heading}</h2>
        <p style="font-size:16px;color:var(--text-1);max-width:460px;margin:0 auto 32px">${c.submitted.body}</p>
        <div style="background:var(--bg-alt);border-radius:20px;padding:24px;text-align:left;max-width:400px;margin:0 auto">
          <div style="font-size:12px;color:var(--text-5);margin-bottom:4px">${c.submitted.nameLabel}</div>
          <div style="font-size:14.5px;margin-bottom:12px">${state.lead.name}</div>
          <div style="font-size:12px;color:var(--text-5);margin-bottom:4px">${c.submitted.challengeLabel}</div>
          <div style="font-size:14.5px;margin-bottom:12px">${problemLabel}</div>
          <div style="font-size:12px;color:var(--text-5);margin-bottom:4px">${c.submitted.supportLabel}</div>
          <div style="font-size:14.5px">${supportLabel}</div>
        </div>
      </div>
    </section>`;
  }

  const dots = [1, 2, 3, 4].map(n => `<div style="height:5px;flex:1;border-radius:3px;background:${n <= state.leadStep ? "var(--accent)" : "rgba(32,30,29,0.14)"}"></div>`).join("");

  let stepHtml = "";
  if (state.leadStep === 1) {
    stepHtml = `
      <h2 class="display" style="font-size:26px;margin:0 0 24px">${c.step1.heading}</h2>
      <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:32px">
        <div><label class="field-label">${c.step1.nameLabel}</label><input class="field" data-field="name" value="${state.lead.name}"></div>
        <div><label class="field-label">${c.step1.emailLabel}</label><input class="field" data-field="email" value="${state.lead.email}"></div>
        <div><label class="field-label">${c.step1.companyLabel}</label><input class="field" data-field="company" value="${state.lead.company}"></div>
      </div>`;
  } else if (state.leadStep === 2) {
    const options = PROBLEMS.map(p => {
      const picked = state.lead.problem === p.id;
      return `<div data-action="pick-problem" data-id="${p.id}" style="cursor:pointer;padding:16px 20px;border-radius:16px;background:${picked ? "var(--bg-card-soft)" : "var(--bg-alt)"};border:2px solid ${picked ? "var(--accent)" : "transparent"};font-size:14.5px">${p.title}</div>`;
    }).join("");
    stepHtml = `
      <h2 class="display" style="font-size:26px;margin:0 0 24px">${c.step2.heading}</h2>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:32px">${options}</div>`;
  } else if (state.leadStep === 3) {
    const options = SUPPORT_OPTIONS.map(o => {
      const picked = state.lead.support === o.id;
      return `<div data-action="pick-support" data-id="${o.id}" style="cursor:pointer;padding:12px 20px;border-radius:999px;background:${picked ? "var(--bg-card-soft)" : "var(--bg-alt)"};border:2px solid ${picked ? "var(--accent)" : "transparent"};font-size:13.5px">${o.label}</div>`;
    }).join("");
    stepHtml = `
      <h2 class="display" style="font-size:26px;margin:0 0 24px">${c.step3.heading}</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px">${options}</div>`;
  } else if (state.leadStep === 4) {
    const options = BUDGET_OPTIONS.map(o => {
      const picked = state.lead.budget === o.id;
      return `<div data-action="pick-budget" data-id="${o.id}" style="cursor:pointer;padding:12px 20px;border-radius:999px;background:${picked ? "var(--bg-card-soft)" : "var(--bg-alt)"};border:2px solid ${picked ? "var(--accent)" : "transparent"};font-size:13.5px">${o.label}</div>`;
    }).join("");
    stepHtml = `
      <h2 class="display" style="font-size:26px;margin:0 0 24px">${c.step4.heading}</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:32px">${options}</div>`;
  }

  const backStyle = state.leadStep === 1
    ? "visibility:hidden;background:transparent;border:none;padding:14px 28px"
    : "background:transparent;color:var(--dark);font-family:var(--font-display);font-size:14px;padding:14px 28px;border-radius:999px;border:1.5px solid rgba(32,30,29,0.2);cursor:pointer";
  const nextLabel = state.leadStep === 4 ? c.submitLabel : c.continueLabel;

  return `
  <section class="section-narrow fade-in">
    <div class="eyebrow">${c.eyebrow}</div>
    <div style="display:flex;gap:6px;margin-bottom:36px">${dots}</div>
    ${stepHtml}
    <div style="display:flex;justify-content:space-between">
      <button data-action="prev-step" style="${backStyle}">${c.backLabel}</button>
      <button class="btn btn-primary" data-action="next-step" style="font-size:14px;padding:14px 28px">${nextLabel}</button>
    </div>
  </section>`;
}

const PAGE_RENDERERS = {
  home: renderHome, solve: renderSolve, services: renderServices,
  council: renderCouncil, experts: renderExperts, pricing: renderPricing,
  about: renderAbout, contact: renderContact,
};

function renderFooter() {
  const cols = FOOTER_COLS.map(col => `
    <div>
      <div class="footer-col-title">${col.title}</div>
      <div class="footer-links">${col.links.map(l => `<span data-action="nav" data-page="${l.page}">${l.label}</span>`).join("")}</div>
    </div>`).join("");

  return `
  <footer>
    <div class="footer-inner">
      <div class="footer-cols">${cols}</div>
      <div class="footer-bottom">
        <div class="display" style="font-size:14px">${SITE.fullName}</div>
        <div style="font-size:12.5px;color:rgba(245,234,216,0.55)">${SITE.footerTagline}</div>
      </div>
    </div>
  </footer>`;
}

function render() {
  const app = document.getElementById("app");
  const pageFn = PAGE_RENDERERS[state.page] || renderHome;
  app.innerHTML = `
    ${renderHeader()}
    <main style="flex:1">${pageFn()}</main>
    ${renderFooter()}
  `;
}

function goTo(page) {
  state.page = page;
  state.expertDetail = null;
  render();
  window.scrollTo(0, 0);
  history.replaceState(null, "", "#" + page);
}

document.getElementById("app").addEventListener("click", function (e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === "nav") { goTo(el.dataset.page); return; }

  if (action === "select-problem") {
    state.selectedProblem = state.selectedProblem === id ? null : id;
    render();
    return;
  }

  if (action === "select-problem-and-go") {
    state.lead.problem = id;
    goTo("contact");
    return;
  }

  if (action === "continue-with-problem") {
    state.lead.problem = state.selectedProblem;
    goTo("contact");
    return;
  }

  if (action === "view-expert") { state.expertDetail = id; render(); window.scrollTo(0, 0); return; }
  if (action === "back-to-experts") { state.expertDetail = null; render(); return; }

  if (action === "pick-problem") { state.lead.problem = id; render(); return; }
  if (action === "pick-support") { state.lead.support = id; render(); return; }
  if (action === "pick-budget") { state.lead.budget = id; render(); return; }

  if (action === "prev-step") {
    state.leadStep = Math.max(1, state.leadStep - 1);
    render();
    return;
  }

  if (action === "next-step") {
    if (state.leadStep >= 4) {
      state.leadSubmitted = true;
      render();
      window.scrollTo(0, 0);
    } else {
      state.leadStep += 1;
      render();
    }
    return;
  }
});

document.getElementById("app").addEventListener("input", function (e) {
  const field = e.target.dataset.field;
  if (!field) return;
  state.lead[field] = e.target.value;
  // No re-render here: re-rendering on every keystroke would rebuild
  // the input and lose cursor position/focus.
});

// Load the page named in the URL (e.g. #pricing) if there is one,
// so links to a specific page work and the browser back/forward
// buttons behave sensibly.
const initialPage = (location.hash || "").replace("#", "");
if (PAGE_RENDERERS[initialPage]) state.page = initialPage;
window.addEventListener("hashchange", function () {
  const p = (location.hash || "").replace("#", "");
  if (PAGE_RENDERERS[p] && p !== state.page) { state.page = p; state.expertDetail = null; render(); }
});

render();
</script>

  /* Make the app fill the viewport height like a normal page layout. */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  #app > main{ flex:1; }
</style>
